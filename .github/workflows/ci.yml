name: CI

# Builds the app and runs the unit tests on every push to main and every pull request.
# Releases (release.yml) run the same tests again before publishing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore PPObjectSearch.slnx

      - name: Build
        run: dotnet build PPObjectSearch.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/PPObjectSearch.Tests -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/PPObjectSearch.Tests/TestResults/*.trx
          if-no-files-found: ignore
