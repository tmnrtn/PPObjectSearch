name: CI

# Builds the app and runs the unit tests on every push to main and every pull request.
# Releases (release.yml) run the same tests again before publishing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest

    steps:
      # Actions are pinned to commit SHAs - a tag can be moved, a commit cannot. Dependabot
      # (.github/dependabot.yml) proposes updates.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      # Locked mode: restore exactly what packages.lock.json records, or fail.
      - name: Restore
        run: dotnet restore PPObjectSearch.slnx --locked-mode

      - name: Build
        run: dotnet build PPObjectSearch.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/PPObjectSearch.Tests -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: tests/PPObjectSearch.Tests/TestResults/*.trx
          if-no-files-found: ignore
