name: Release

# Tag a commit to cut a release:
#   git tag v1.0.0 && git push origin v1.0.0
# Or run it by hand from the Actions tab to get the exe as a build artifact.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Nothing may write by default. Only the release job, which runs no build or package code at all,
# is given the right to create the release.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: read
      actions: read   # SignPath reads this run's details and downloads the unsigned artifacts

    outputs:
      signing-policy: ${{ steps.signing.outputs.policy }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      # Locked mode: the release is built from exactly the packages packages.lock.json records -
      # the same ones the tests below run against.
      - name: Restore
        run: dotnet restore PPObjectSearch.slnx --locked-mode

      # A release is never cut from a build whose tests fail.
      - name: Test
        run: dotnet test tests/PPObjectSearch.Tests -c Release --no-restore

      - name: Publish
        shell: pwsh
        run: |
          # Version comes from the tag when there is one, so the exe's file version matches
          # the release. Manual runs just build 1.0.0.
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $env:GITHUB_REF -replace '^refs/tags/v', ''
          } else {
            '1.0.0'
          }
          Write-Host "Publishing version $version"
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          # Publishing adds the SDK's own ILLink package, whose version follows the SDK, so this
          # restore leaves the lock file alone; every package is still pinned to an exact version.
          # Self-contained: the exe runs on a machine with no .NET installed, at the cost of
          # size (~150 MB). For a small, framework-dependent build instead, set
          # --self-contained false and require the .NET 10 Desktop Runtime on the target.
          dotnet publish PPObjectSearch.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:NuGetLockFilePath=obj/publish.packages.lock.json `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none `
            -p:Version=$version `
            -o publish

          # The command line, for pipelines: a console exe, published the same way.
          dotnet publish tools/ppos/ppos.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:NuGetLockFilePath=obj/publish.packages.lock.json `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none `
            -p:Version=$version `
            -o publish-cli
          Copy-Item publish-cli/ppos.exe publish/ppos.exe

      # Signing (packaging/signpath/README.md) is on once SignPath is set up: the SIGNPATH_API_TOKEN
      # secret and the SIGNPATH_ORGANIZATION_ID variable. Without them (a fork, or before setup)
      # the build is unsigned. A step's if cannot read secrets, so this step checks for them.
      - name: Check for signing
        id: signing
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: |
          if ($env:SIGNPATH_API_TOKEN -and $env:SIGNPATH_ORGANIZATION_ID) {
            # A tag is signed with the real certificate, which SignPath holds until the request is
            # approved there. A manual run is signed with SignPath's untrusted test certificate.
            $policy = if ($env:GITHUB_REF -like 'refs/tags/v*') { 'release-signing' } else { 'test-signing' }
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "policy=$policy" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Signing with the $policy policy"
          } else {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "::notice::SignPath is not set up, so this build is unsigned."
          }

      # SignPath signs only what this workflow uploaded as an artifact, so the exes go up, come back
      # signed, and replace the unsigned ones - before the installer is built around them.
      - name: Upload unsigned exes
        id: unsigned-exes
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-exes
          path: |
            publish/PPObjectSearch.exe
            publish/ppos.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign exes
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'PPObjectSearch' }}
          signing-policy-slug: ${{ steps.signing.outputs.policy }}
          artifact-configuration-slug: exes
          github-artifact-id: ${{ steps.unsigned-exes.outputs.artifact-id }}
          # Long enough to approve the request in SignPath after pushing the tag.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-exes

      - name: Use signed exes
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: Copy-Item signed-exes/PPObjectSearch.exe, signed-exes/ppos.exe publish/ -Force

      # The installer (packaging/installer/PPObjectSearch.iss): both exes, a Start menu shortcut,
      # ppos on PATH and an uninstaller. Inno Setup comes preinstalled on the Windows runner.
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup is not installed on this runner: $iscc not found" }
          # The installer's file version takes numbers only, so 1.2.3-beta is stamped 1.2.3.
          $fileVersion = ($env:VERSION -split '[-+]')[0]
          & $iscc /Qp "/DAppVersion=$env:VERSION" "/DFileVersion=$fileVersion" `
            "/DPublishDir=$PWD\publish" packaging/installer/PPObjectSearch.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      # The installer is signed by its own request - a second approval in SignPath for a release.
      - name: Upload unsigned installer
        id: unsigned-installer
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-installer
          path: publish/PPObjectSearch-Setup.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign installer
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'PPObjectSearch' }}
          signing-policy-slug: ${{ steps.signing.outputs.policy }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-installer

      # On a tag every file must carry a valid signature from the trusted certificate; a test-signed
      # manual run just reports what it got.
      - name: Check signatures
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          POLICY: ${{ steps.signing.outputs.policy }}
        run: |
          Copy-Item signed-installer/PPObjectSearch-Setup.exe publish/ -Force
          foreach ($exe in 'PPObjectSearch.exe', 'ppos.exe', 'PPObjectSearch-Setup.exe') {
            $sig = Get-AuthenticodeSignature "publish/$exe"
            Write-Host "${exe}: $($sig.Status), $($sig.SignerCertificate.Subject)"
            if (-not $sig.SignerCertificate) { throw "$exe is not signed" }
            if ($env:POLICY -eq 'release-signing' -and $sig.Status -ne 'Valid') {
              throw "$exe signature is $($sig.Status): $($sig.StatusMessage)"
            }
          }

      # A checksum published beside each file, so a download can be checked against the release. It
      # is taken after signing, which changes the file.
      - name: Checksum
        shell: pwsh
        run: |
          foreach ($exe in 'PPObjectSearch.exe', 'ppos.exe', 'PPObjectSearch-Setup.exe') {
            $hash = (Get-FileHash "publish/$exe" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $exe" | Out-File -FilePath "publish/$exe.sha256" -Encoding ascii -NoNewline
            Write-Host "$exe SHA-256: $hash"
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PPObjectSearch-win-x64
          path: |
            publish/PPObjectSearch.exe
            publish/PPObjectSearch.exe.sha256
            publish/ppos.exe
            publish/ppos.exe.sha256
            publish/PPObjectSearch-Setup.exe
            publish/PPObjectSearch-Setup.exe.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write       # create the release
      id-token: write       # sign the provenance attestation
      attestations: write   # store it

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: PPObjectSearch-win-x64
          path: publish

      # Build provenance: anyone can check (gh attestation verify) that the exe came from this
      # repository's workflow at this tag.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            publish/PPObjectSearch.exe
            publish/ppos.exe
            publish/PPObjectSearch-Setup.exe

      # The GitHub CLI on the runner rather than a third-party action: this step can write to the
      # repository, so nothing outside GitHub's own tooling runs with that permission.
      # SignPath Foundation asks for its attribution and the code signing policy on the release page.
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SIGNING_POLICY: ${{ needs.build.outputs.signing-policy }}
        run: |
          notes=""
          if [ "$SIGNING_POLICY" = "release-signing" ]; then
            notes="Free code signing provided by [SignPath.io](https://signpath.io), certificate by [SignPath Foundation](https://signpath.org) - see the [code signing policy](https://github.com/$GITHUB_REPOSITORY#code-signing-policy)."
          fi
          gh release create "$TAG" publish/PPObjectSearch.exe publish/PPObjectSearch.exe.sha256 \
            publish/ppos.exe publish/ppos.exe.sha256 \
            publish/PPObjectSearch-Setup.exe publish/PPObjectSearch-Setup.exe.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes "$notes" \
            --generate-notes \
            --verify-tag

  # Opens pull requests on microsoft/winget-pkgs that move both winget packages to this release.
  # wingetcreate update only updates a package winget-pkgs already has, so the first version of each
  # is submitted by hand - see packaging/winget/README.md.
  winget:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: windows-latest

    # Everything here acts on winget-pkgs with the token below, never on this repository.
    permissions: {}

    env:
      # A classic PAT with public_repo (fine-grained tokens are not supported), from the account the
      # winget-pkgs pull requests come from. wingetcreate reads it from this variable, which keeps it
      # off the command line.
      WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
      # Pinned like the actions above, which Dependabot does not cover: to upgrade, copy the version
      # and wingetcreate.exe's sha256 digest from a microsoft/winget-create release.
      WINGETCREATE_VERSION: v1.12.13.0
      WINGETCREATE_SHA256: 24042bd37915805615e6cf969ac57c6439124c3fe85823327f5f3fb24bd9ffea

    steps:
      # A job's if cannot read secrets, so each step checks the token instead. Without one (a fork,
      # or before the secret is set up) the job passes having done nothing.
      - name: Check for a token
        if: env.WINGET_CREATE_GITHUB_TOKEN == ''
        run: Write-Host "::notice::WINGET_TOKEN is not set, so no winget-pkgs pull request was opened."

      # Microsoft's own release of wingetcreate rather than a third-party action, checked against
      # the pinned hash before it runs with the token.
      - name: Download wingetcreate
        if: env.WINGET_CREATE_GITHUB_TOKEN != ''
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/microsoft/winget-create/releases/download/$env:WINGETCREATE_VERSION/wingetcreate.exe" `
            -OutFile wingetcreate.exe
          $hash = (Get-FileHash wingetcreate.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:WINGETCREATE_SHA256) {
            throw "wingetcreate.exe SHA-256 is $hash, expected $env:WINGETCREATE_SHA256"
          }

      # One package per exe, each pointed at the exe the release job just attached.
      - name: Submit to winget-pkgs
        if: env.WINGET_CREATE_GITHUB_TOKEN != ''
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG -replace '^v', ''
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG"
          $packages = [ordered]@{
            'TomNorton.PPObjectSearch'     = "$base/PPObjectSearch.exe"
            'TomNorton.PPObjectSearch.CLI' = "$base/ppos.exe"
          }
          $failed = $false
          foreach ($id in $packages.Keys) {
            # Until a package's first submission is merged there is nothing to update: skip it
            # rather than fail a release that has already been published.
            $path = 'manifests/' + $id.Substring(0, 1).ToLowerInvariant() + '/' + ($id -replace '\.', '/')
            try {
              $entries = Invoke-RestMethod "https://api.github.com/repos/microsoft/winget-pkgs/contents/$path" `
                -Headers @{ Authorization = "Bearer $env:WINGET_CREATE_GITHUB_TOKEN" }
            } catch {
              if ($_.Exception.Response.StatusCode -ne 404) { throw }
              $entries = @()
            }
            # Version folders only: TomNorton/PPObjectSearch also holds the CLI package's folder.
            if (-not ($entries | Where-Object { $_.type -eq 'dir' -and $_.name -match '^\d' })) {
              Write-Host "::notice::$id is not in winget-pkgs yet, so it was not updated."
              continue
            }

            ./wingetcreate.exe update $id `
              --version $version `
              --urls $packages[$id] `
              --release-notes-url "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:TAG" `
              --release-date (Get-Date -AsUTC -Format 'yyyy-MM-dd') `
              --no-open `
              --submit
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::wingetcreate update $id failed with exit code $LASTEXITCODE."
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
