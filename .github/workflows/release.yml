name: Release

# Tag a commit to cut a release:
#   git tag v1.0.0 && git push origin v1.0.0
# Or run it by hand from the Actions tab to get the exe as a build artifact.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Publish
        shell: pwsh
        run: |
          # Version comes from the tag when there is one, so the exe's file version matches
          # the release. Manual runs just build 1.0.0.
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $env:GITHUB_REF -replace '^refs/tags/v', ''
          } else {
            '1.0.0'
          }
          Write-Host "Publishing version $version"

          # Self-contained: the exe runs on a machine with no .NET installed, at the cost of
          # size (~150 MB). For a small, framework-dependent build instead, set
          # --self-contained false and require the .NET 10 Desktop Runtime on the target.
          dotnet publish PPObjectSearch.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none `
            -p:Version=$version `
            -o publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PPObjectSearch-win-x64
          path: publish/PPObjectSearch.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/PPObjectSearch.exe
          generate_release_notes: true
